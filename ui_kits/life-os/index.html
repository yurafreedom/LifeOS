  <script>
    /* Pre-paint theme application — must run before stylesheet loads
       so the user never sees a flash of the wrong theme. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('lifeOsTheme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light' && t !== 'paradise') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      /* Sprint 3.6 · paradise: resolve day/night from Kyiv time before
         first paint so the scene tokens never flash the wrong scene. */
      if (t === 'paradise') {
        var h;
        try {
          h = parseInt(new Intl.DateTimeFormat('en-US',
            { timeZone: 'Europe/Kiev', hour: 'numeric', hour12: false })
            .format(new Date()), 10) % 24;
        } catch (e) { h = new Date().getHours(); }
        document.documentElement.setAttribute('data-scene', (h >= 20 || h < 6) ? 'night' : 'day');
      }
    })();
  </script>
