[project]
name = "lifeos-api"
version = "0.1.0"
description = "Server-backed multi-account state service for LifeOS"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.18.5",
  "email-validator==2.3.0",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-tools==7.6.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
