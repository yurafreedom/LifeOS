<!doctype html>
<!-- @dsCard group="Components" name="Progress" subtitle="Primary · accent · success bars" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>components · progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .row { display: flex; flex-direction: column; gap: 18px; margin-top: 14px; }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .lab { font-family: 'Work Sans', monospace; font-size: 10px; color: #8E8E93; }
  .val { font-family: 'Work Sans', monospace; font-size: 12px; color: #F5F5F7; font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
  .fill-primary { height: 100%; background: #229ED9; border-radius: 999px; }
  .fill-accent  { height: 100%; background: linear-gradient(90deg, #FFC066, #FF8A1E, #FF6B0A); border-radius: 999px; }
  .fill-success { height: 100%; background: #1D9E75; border-radius: 999px; }
  .note { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #5C5C63; margin-top: 4px; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">progress</div>
  <div class="row">
    <div>
      <div class="label-row"><span class="lab">habits · this week</span><span class="val">48/56</span></div>
      <div class="track"><div class="fill-primary" style="width: 85%;"></div></div>
      <div class="note">primary · neutral progress</div>
    </div>
    <div>
      <div class="label-row"><span class="lab" style="color:#FF8A1E;">goal · emergency fund</span><span class="val">$1,550 / $2,500</span></div>
      <div class="track"><div class="fill-accent" style="width: 62%;"></div></div>
      <div class="note">accent · stakes only</div>
    </div>
    <div>
      <div class="label-row"><span class="lab" style="color:#4FCAA0;">budget · food · oct</span><span class="val">$140 / $300</span></div>
      <div class="track"><div class="fill-success" style="width: 47%;"></div></div>
      <div class="note">success · under budget</div>
    </div>
  </div>
</div></body></html>
