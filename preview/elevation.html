<!doctype html>

<style>

  .e2 { box-shadow: 0 8px 24px -12px rgba(0,0,0,0.5); }
  .e3 { box-shadow: 0 12px 30px -14px rgba(0,0,0,0.6); transform: translateY(-1px); border-color: rgba(255,255,255,0.14); }

<body><div class="frame">
  <div class="eyebrow">elevation · subtle only</div>
  <div class="grid">
    <div class="demo e1"><div class="nm">shadow-1 · inset</div><div class="lab">rest</div></div>
    <div class="demo e2"><div class="nm">shadow-2 · drop</div><div class="lab">popover</div></div>
    <div class="demo e3"><div class="nm">shadow-hover</div><div class="lab">hovered</div></div>
