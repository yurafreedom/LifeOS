<!doctype html>
<!-- @dsCard group="Components" name="day-detail-modal" subtitle="Sprint 3B · full-day event list w/ source codes" viewport="1200x640" -->
<html><head><meta charset="utf-8"><title>components · day detail modal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .frame {
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
  }

  .scrim {
    background: rgba(0,0,0,0.45);
    padding: 24px;
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
  }

  .modal {
    background: #1A1F28;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    max-height: 540px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .eyebrow { font: 500 10px 'Work Sans', monospace; color: #8E8E93; }
  .title {
    font: 700 20px 'Onest', sans-serif; color: #F5F5F7;
    margin: 4px 0 0; letter-spacing: -0.02em;
    text-transform: lowercase;
  }
  .close {
    width: 24px; height: 24px; border-radius: 6px;
    background: transparent; color: #8E8E93; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
  }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }

  .pill-lg {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    height: 26px; padding: 0 14px 0 18px;
    background: transparent; border: none; border-radius: 4px;
    width: 100%; text-align: left;
  }
  .pill-lg:hover { background: rgba(255,255,255,0.04); }
  .bar {
    position: absolute; left: 0; top: 4px; bottom: 4px;
    width: 3px; border-radius: 2px;
    background: #8E8E93;
  }
  .pill-lg.is-stakes .bar  { background: linear-gradient(180deg, #FF8A1E, #DB5A0C); }
  .pill-lg.is-routine .bar { background: #229ED9; }
  .pill-lg.is-info .bar    { background: #5C5C63; }
  .time { font: 500 12px 'Work Sans', monospace; color: #8E8E93; flex: none; }
  .titlex { color: #F5F5F7; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { font: 500 9.5px 'Work Sans', monospace; color: #5C5C63; flex: none; }

  .foot {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 20px;
  }
  .add {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 14px;
    color: #C7C7CC;
    font: 500 12px 'Work Sans', sans-serif;
  }
</style></head>
<body><div class="frame">

  <div class="scrim">
    <div class="modal">
      <div class="head">
        <div>
          <div class="eyebrow">2026</div>
          <h3 class="title">среда, 14 октября</h3>
        </div>
        <button class="close">×</button>
      </div>
      <div class="body">
        <ul class="list">
          <li><button class="pill-lg is-routine"><span class="bar"></span><span class="time">07:00</span><span class="titlex">пробежка</span><span class="src">HEALTH</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">08:00</span><span class="titlex">кормление пса</span><span class="src">DOG</span></button></li>
          <li><button class="pill-lg is-routine"><span class="bar"></span><span class="time">09:00</span><span class="titlex">дейли</span><span class="src">WORK</span></button></li>
          <li><button class="pill-lg is-routine"><span class="bar"></span><span class="time">10:30</span><span class="titlex">ревью макетов</span><span class="src">WORK</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">12:00</span><span class="titlex">обед с Х</span><span class="src">SOCIAL</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">14:00</span><span class="titlex">кормление пса</span><span class="src">DOG</span></button></li>
          <li><button class="pill-lg is-stakes"><span class="bar"></span><span class="time">14:00</span><span class="titlex">релиз v1</span><span class="src">WORK</span></button></li>
          <li><button class="pill-lg is-routine"><span class="bar"></span><span class="time">16:00</span><span class="titlex">1:1 с тимлидом</span><span class="src">WORK</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">17:30</span><span class="titlex">аренда — списание</span><span class="src">BILL</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">18:30</span><span class="titlex">продукты</span><span class="src">WORK</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">20:00</span><span class="titlex">звонок ветеринару</span><span class="src">HEALTH</span></button></li>
          <li><button class="pill-lg is-info"><span class="bar"></span><span class="time">20:00</span><span class="titlex">кормление пса</span><span class="src">DOG</span></button></li>
          <li><button class="pill-lg is-routine"><span class="bar"></span><span class="time">21:00</span><span class="titlex">чтение 30 страниц</span><span class="src">WORK</span></button></li>
        </ul>
      </div>
      <div class="foot">
        <button class="add">+ добавить событие</button>
      </div>
    </div>
  </div>

</div></body></html>
