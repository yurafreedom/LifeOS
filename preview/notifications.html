<!doctype html>
<!-- @dsCard group="Components" name="Notifications" subtitle="System toast + telegram-bot toast" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>components · telegram bot toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .toasts { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .toast {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  .toast.bot { border-color: rgba(255,138,30,0.32); box-shadow: 0 10px 28px -12px rgba(255,107,10,0.4); }
  .av { width: 32px; height: 32px; border-radius: 999px; flex: none;
        background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;
        font-family: 'Work Sans', monospace; font-size: 11px; color: #C7C7CC; }
  .av.bot { background: linear-gradient(135deg, #FFC066 0%, #FF8A1E 48%, #FF6B0A 100%); color: #fff; font-weight: 600; }
  .body { flex: 1; }
  .name { font-family: 'Work Sans', monospace; font-size: 10px; color: #8E8E93; }
  .name.bot { color: #FF8A1E; }
  .msg  { font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 14px; color: #F5F5F7; margin-top: 4px; line-height: 1.45; }
  .ts   { font-family: 'Work Sans', monospace; font-size: 10px; color: #5C5C63; margin-top: 6px; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">notifications</div>
  <div class="toasts">
    <div class="toast">
      <div class="av">sys</div>
      <div class="body">
        <div class="name">system</div>
        <div class="msg">expense logged · $42.00 → food</div>
        <div class="ts">14:32 · TODAY</div>
      </div>
    </div>
    <div class="toast bot">
      <div class="av bot">tg</div>
      <div class="body">
        <div class="name bot">telegram-bot</div>
        <div class="msg">you said you'd run today. it's 19:47.</div>
        <div class="ts">19:47 · TODAY</div>
      </div>
    </div>
  </div>
</div></body></html>
