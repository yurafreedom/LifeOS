<!doctype html>
<!-- @dsCard group="Brand" name="chart-trend" subtitle="6-month trend · expenses / income / net toggle" viewport="1280x420" -->
<html><head><meta charset="utf-8"><title>components · trend chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  body { background-image: none; background-color: #0E1117; }
  .frame { padding: 22px; display: flex; flex-direction: column; gap: 22px; }
  .label {
    font-family: 'Work Sans', monospace; font-size: 10px; color: #8E8E93;
  }
  .grid3 {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .chart-card {
    display: flex; flex-direction: column;
    background: #14181F;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px;
    min-height: 280px;
  }
  .head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .eb { font-family: 'Work Sans', monospace; font-size: 10px; color: #8E8E93; }
  .total { font: 500 24px 'Work Sans', monospace; color: #F5F5F7; line-height: 1.1; letter-spacing: -0.01em; }
  .seg { display: inline-flex; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 2px; gap: 2px; margin-bottom: 12px; align-self: flex-start; }
  .seg button { appearance: none; background: transparent; border: none; padding: 4px 10px; border-radius: 6px; font-family: 'Work Sans', monospace; font-size: 10.5px; color: #8E8E93; cursor: pointer; }
  .seg .on { background: rgba(34,158,217,0.12); color: #5BB8E8; }
  .body { flex: 1; position: relative; min-height: 160px; }
  svg { width: 100%; height: 100%; min-height: 160px; display: block; overflow: visible; }
  .xlbl { fill: #5C5C63; font-family: 'Work Sans', monospace; font-size: 10px; }
  .line { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .dot  { stroke: #14181F; stroke-width: 1.5; }

  .is-expenses .line, .is-expenses .dot { stroke: #229ED9; fill: #229ED9; }
  .is-expenses .line { fill: none; }
  .is-expenses .area { fill: #229ED9; opacity: 0.10; }

  .is-income .line, .is-income .dot { stroke: #1577A8; fill: #1577A8; }
  .is-income .line { fill: none; }
  .is-income .area { fill: #1577A8; opacity: 0.10; }

  .is-net .line, .is-net .dot { stroke: #8E8E93; fill: #8E8E93; }
  .is-net .line { fill: none; }
  .is-net .area { fill: #8E8E93; opacity: 0.05; }
</style></head>
<body><div class="frame">

  <div class="label">trend · 6-month series · three toggle states</div>
  <div class="grid3">

    <!-- expenses (default) -->
    <div class="chart-card is-expenses">
      <div class="head">
        <span class="eb">тенденция · 6 месяцев</span>
        <span class="total">$2 480</span>
      </div>
      <div class="seg"><button class="on">расходы</button><button>доходы</button><button>нетто</button></div>
      <div class="body">
        <svg viewBox="0 0 600 200" preserveAspectRatio="none">
          <path class="area" d="M28,72 L142.4,99 L256.8,9 L371.2,92 L485.6,19 L600,89 L600,168 L28,168 Z"/>
          <polyline class="line" points="28,72 142.4,99 256.8,9 371.2,92 485.6,19 600,89"/>
          <circle class="dot" cx="28"   cy="72" r="2.5"/>
          <circle class="dot" cx="142.4" cy="99" r="2.5"/>
          <circle class="dot" cx="256.8" cy="9"  r="2.5"/>
          <circle class="dot" cx="371.2" cy="92" r="2.5"/>
          <circle class="dot" cx="485.6" cy="19" r="2.5"/>
          <circle class="dot" cx="600"   cy="89" r="2.5"/>
          <text class="xlbl" x="28"    y="190" text-anchor="middle">янв</text>
          <text class="xlbl" x="142.4" y="190" text-anchor="middle">фев</text>
          <text class="xlbl" x="256.8" y="190" text-anchor="middle">мар</text>
          <text class="xlbl" x="371.2" y="190" text-anchor="middle">апр</text>
          <text class="xlbl" x="485.6" y="190" text-anchor="middle">май</text>
          <text class="xlbl" x="600"   y="190" text-anchor="middle">июн</text>
        </svg>
      </div>
    </div>

    <!-- income -->
    <div class="chart-card is-income">
      <div class="head">
        <span class="eb">тенденция · 6 месяцев</span>
        <span class="total">$5 200</span>
      </div>
      <div class="seg"><button>расходы</button><button class="on">доходы</button><button>нетто</button></div>
      <div class="body">
        <svg viewBox="0 0 600 200" preserveAspectRatio="none">
          <path class="area" d="M28,88 L142.4,88 L256.8,16 L371.2,88 L485.6,72 L600,88 L600,168 L28,168 Z"/>
          <polyline class="line" points="28,88 142.4,88 256.8,16 371.2,88 485.6,72 600,88"/>
          <circle class="dot" cx="28"   cy="88" r="2.5"/>
          <circle class="dot" cx="142.4" cy="88" r="2.5"/>
          <circle class="dot" cx="256.8" cy="16" r="2.5"/>
          <circle class="dot" cx="371.2" cy="88" r="2.5"/>
          <circle class="dot" cx="485.6" cy="72" r="2.5"/>
          <circle class="dot" cx="600"   cy="88" r="2.5"/>
          <text class="xlbl" x="28"    y="190" text-anchor="middle">янв</text>
          <text class="xlbl" x="142.4" y="190" text-anchor="middle">фев</text>
          <text class="xlbl" x="256.8" y="190" text-anchor="middle">мар</text>
          <text class="xlbl" x="371.2" y="190" text-anchor="middle">апр</text>
          <text class="xlbl" x="485.6" y="190" text-anchor="middle">май</text>
          <text class="xlbl" x="600"   y="190" text-anchor="middle">июн</text>
        </svg>
      </div>
    </div>

    <!-- net -->
    <div class="chart-card is-net">
      <div class="head">
        <span class="eb">тенденция · 6 месяцев</span>
        <span class="total">$2 720</span>
      </div>
      <div class="seg"><button>расходы</button><button>доходы</button><button class="on">нетто</button></div>
      <div class="body">
        <svg viewBox="0 0 600 200" preserveAspectRatio="none">
          <path class="area" d="M28,90 L142.4,76 L256.8,80 L371.2,82 L485.6,108 L600,68 L600,168 L28,168 Z"/>
          <polyline class="line" points="28,90 142.4,76 256.8,80 371.2,82 485.6,108 600,68"/>
          <circle class="dot" cx="28"    cy="90"  r="2.5"/>
          <circle class="dot" cx="142.4" cy="76"  r="2.5"/>
          <circle class="dot" cx="256.8" cy="80"  r="2.5"/>
          <circle class="dot" cx="371.2" cy="82"  r="2.5"/>
          <circle class="dot" cx="485.6" cy="108" r="2.5"/>
          <circle class="dot" cx="600"   cy="68"  r="2.5"/>
          <text class="xlbl" x="28"    y="190" text-anchor="middle">янв</text>
          <text class="xlbl" x="142.4" y="190" text-anchor="middle">фев</text>
          <text class="xlbl" x="256.8" y="190" text-anchor="middle">мар</text>
          <text class="xlbl" x="371.2" y="190" text-anchor="middle">апр</text>
          <text class="xlbl" x="485.6" y="190" text-anchor="middle">май</text>
          <text class="xlbl" x="600"   y="190" text-anchor="middle">июн</text>
        </svg>
      </div>
    </div>

  </div>

</div></body></html>
