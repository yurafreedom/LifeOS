<!doctype html>
<!-- @dsCard group="Brand" name="Badges" subtitle="Routine · stakes · state" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>components · badges</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .badge {
    font-family: 'Work Sans', monospace; font-weight: 500; font-size: 10px;
    padding: 4px 8px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid transparent;
  }
  .b-primary { background: rgba(34,158,217,0.12); color: #5BB8E8; border-color: rgba(34,158,217,0.25); }
  .b-stakes  { background: rgba(255,138,30,0.10); color: #FFC066; border-color: rgba(255,138,30,0.32); }
  .b-success { background: rgba(29,158,117,0.14); color: #4FCAA0; border-color: rgba(29,158,117,0.3); }
  .b-warn    { background: rgba(241,179,59,0.14); color: #F1B33B; border-color: rgba(241,179,59,0.3); }
  .b-danger  { background: rgba(229,72,77,0.14); color: #FF7479; border-color: rgba(229,72,77,0.3); }
  .b-neutral { background: rgba(255,255,255,0.05); color: #8E8E93; border-color: rgba(255,255,255,0.1); }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .lab { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; min-width: 60px; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">badges &amp; status pills</div>
  <div class="row">
    <span class="lab">routine</span>
    <span class="badge b-primary"><span class="dot"></span>habit</span>
    <span class="badge b-neutral">backlog</span>
    <span class="badge b-success"><span class="dot"></span>done</span>
  </div>
  <div class="row">
    <span class="lab">stakes</span>
    <span class="badge b-stakes"><span class="dot"></span>today</span>
    <span class="badge b-stakes">goal · q3</span>
    <span class="badge b-stakes">high</span>
  </div>
  <div class="row">
    <span class="lab">state</span>
    <span class="badge b-warn"><span class="dot"></span>overdue</span>
    <span class="badge b-danger"><span class="dot"></span>broken streak</span>
  </div>
</div></body></html>
