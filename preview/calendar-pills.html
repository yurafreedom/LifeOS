<!doctype html>
<!-- @dsCard group="Components" name="calendar-pills" subtitle="Sprint 3B · week view, N=8 pills/day, +N overflow" viewport="1200x480" -->
<html><head><meta charset="utf-8"><title>components · calendar pills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .frame { padding: 24px; }
  .label { font: 500 10px 'Work Sans', monospace; color: #8E8E93; margin-bottom: 12px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
  }
  .day { display: flex; flex-direction: column; background: #14181F; min-height: 240px; }
  .day.is-today { background: rgba(34,158,217,0.06); }

  .head { text-align: center; padding: 10px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .dow { font: 500 9.5px 'Work Sans', monospace; color: #5C5C63; }
  .num { font: 700 18px 'Onest', sans-serif; color: #F5F5F7; margin-top: 2px; letter-spacing: -0.02em; }
  .num.is-today {
    display: inline-flex; min-width: 28px; height: 28px;
    align-items: center; justify-content: center;
    background: #229ED9; color: #fff;
    border-radius: 999px; font-size: 14px;
  }

  .body { flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 6px; }

  .pill {
    position: relative;
    display: flex; align-items: center; gap: 6px;
    height: 18px; padding: 0 6px 0 9px;
    background: transparent; border: none; border-radius: 4px;
    font-size: 12px; color: #F5F5F7;
    width: 100%; text-align: left; overflow: hidden;
  }
  .pill-bar {
    position: absolute; left: 0; top: 2px; bottom: 2px;
    width: 3px; border-radius: 2px;
    background: #8E8E93;
  }
  .pill.is-stakes .pill-bar  { background: linear-gradient(180deg, #FF8A1E, #DB5A0C); }
  .pill.is-routine .pill-bar { background: #229ED9; }
  .pill.is-info .pill-bar    { background: #5C5C63; }

  .pill-time { font: 500 11px 'Work Sans', monospace; color: #8E8E93; flex: none; }
  .pill-title { font-size: 12px; color: #F5F5F7; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pill-more {
    height: 18px; font: 500 10px 'Work Sans', monospace; color: #8E8E93;
    padding-left: 9px; text-align: left; background: transparent; border: none;
  }

  .legend {
    margin-top: 14px;
    display: flex; gap: 24px; align-items: center;
    font: 500 10.5px 'Work Sans', monospace; color: #8E8E93;
  }
  .swatch { display: inline-flex; align-items: center; gap: 8px; }
  .swatch::before { content: ''; width: 3px; height: 12px; border-radius: 2px; }
  .swatch.stakes::before  { background: linear-gradient(180deg, #FF8A1E, #DB5A0C); }
  .swatch.routine::before { background: #229ED9; }
  .swatch.info::before    { background: #5C5C63; }
</style></head>
<body><div class="frame">

  <div class="label">week view · pill density (N=8, "+N more" on overflow)</div>

  <div class="grid">
    <!-- Monday — sparse 3 -->
    <div class="day">
      <div class="head"><div class="dow">пн</div><div class="num">12</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">09:00</span><span class="pill-title">дейли</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">14:00</span><span class="pill-title">прогулка</span></button>
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">17:30</span><span class="pill-title">спортзал</span></button>
      </div>
    </div>

    <!-- Tuesday — medium 4 -->
    <div class="day">
      <div class="head"><div class="dow">вт</div><div class="num">13</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">08:30</span><span class="pill-title">позвонить маме</span></button>
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">11:00</span><span class="pill-title">просмотр PR</span></button>
        <button class="pill is-stakes"><span class="pill-bar"></span><span class="pill-time">15:00</span><span class="pill-title">терапия</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">19:00</span><span class="pill-title">ужин с Аней</span></button>
      </div>
    </div>

    <!-- Wednesday — overflow (10 events → 7 + "+3") · today -->
    <div class="day is-today">
      <div class="head"><div class="dow">ср</div><div class="num is-today">14</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">07:00</span><span class="pill-title">пробежка</span></button>
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">09:00</span><span class="pill-title">дейли</span></button>
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">10:30</span><span class="pill-title">ревью макетов</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">12:00</span><span class="pill-title">обед с Х</span></button>
        <button class="pill is-stakes"><span class="pill-bar"></span><span class="pill-time">14:00</span><span class="pill-title">релиз v1</span></button>
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">16:00</span><span class="pill-title">1:1 с тимлидом</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">17:30</span><span class="pill-title">аренда — списание</span></button>
        <button class="pill-more">+ 3 ещё</button>
      </div>
    </div>

    <!-- Thursday — medium 4 -->
    <div class="day">
      <div class="head"><div class="dow">чт</div><div class="num">15</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">09:30</span><span class="pill-title">focus block</span></button>
        <button class="pill is-stakes"><span class="pill-bar"></span><span class="pill-time">11:00</span><span class="pill-title">цели Q4</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">14:00</span><span class="pill-title">прогулка</span></button>
        <button class="pill is-stakes"><span class="pill-bar"></span><span class="pill-time">18:00</span><span class="pill-title">стоматолог</span></button>
      </div>
    </div>

    <!-- Friday — medium 4 -->
    <div class="day">
      <div class="head"><div class="dow">пт</div><div class="num">16</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">09:00</span><span class="pill-title">дейли</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">12:30</span><span class="pill-title">обед с командой</span></button>
        <button class="pill is-stakes"><span class="pill-bar"></span><span class="pill-time">15:00</span><span class="pill-title">демо клиенту</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">19:00</span><span class="pill-title">кино</span></button>
      </div>
    </div>

    <!-- Saturday — sparse 2 -->
    <div class="day">
      <div class="head"><div class="dow">сб</div><div class="num">17</div></div>
      <div class="body">
        <button class="pill is-routine"><span class="pill-bar"></span><span class="pill-time">10:00</span><span class="pill-title">пробежка</span></button>
        <button class="pill is-info"><span class="pill-bar"></span><span class="pill-time">15:00</span><span class="pill-title">ужин с Аней</span></button>
      </div>
    </div>

    <!-- Sunday — empty -->
    <div class="day">
      <div class="head"><div class="dow">вс</div><div class="num">18</div></div>
      <div class="body">
        <div style="font: 500 10px 'Work Sans', monospace; color: #5C5C63; padding: 4px;">тихий день</div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span class="swatch stakes">stakes</span>
    <span class="swatch routine">routine</span>
    <span class="swatch info">info · bills · feedings · doses</span>
    <span style="margin-left:auto; color:#5C5C63;">today col = blue tint (locked) · not stakes</span>
  </div>

</div></body></html>
