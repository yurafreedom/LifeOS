<!doctype html>
<!-- @dsCard group="Brand" name="Neutral & text" subtitle="Surfaces & text ramp" viewport="700x290" -->
<html><head><meta charset="utf-8"><title>colors · neutral / surfaces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw {
    border-radius: 12px; padding: 14px; min-height: 110px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .sw .nm   { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; }
  .sw .hex  { font-family: 'Work Sans', monospace; font-size: 11px; color: #C7C7CC; }
  .sw .lab  { font-family: 'Onest', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: -0.01em; color: #fff; }
  .bg     { background: #0E1117; }
  .elev1  { background: #14181F; }
  .elev2  { background: #1A1F28; }
  .card   { background: rgba(255,255,255,0.035); }
  .text-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .tw { padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.025); }
  .tw .sample { font-family: 'Onest', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .tw .nm     { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; margin-top: 4px; }
  .tw .hex    { font-family: 'Work Sans', monospace; font-size: 10px; color: #8E8E93; }
</style></head>
<body><div class="frame">
  <div class="eyebrow" style="margin-bottom:10px;">surfaces &amp; text</div>
  <div class="grid">
    <div class="sw bg"><div class="nm">bg</div><div><div class="lab">canvas</div><div class="hex">#0E1117</div></div></div>
    <div class="sw elev1"><div class="nm">elev-1</div><div><div class="lab">popover</div><div class="hex">#14181F</div></div></div>
    <div class="sw elev2"><div class="nm">elev-2</div><div><div class="lab">cmdbar</div><div class="hex">#1A1F28</div></div></div>
    <div class="sw card"><div class="nm">card</div><div><div class="lab">surface</div><div class="hex">#FFF · 3.5%</div></div></div>
  </div>
  <div class="text-row">
    <div class="tw"><div class="sample" style="color:#F5F5F7;">Aa</div><div class="nm">fg-1</div><div class="hex">#F5F5F7</div></div>
    <div class="tw"><div class="sample" style="color:#C7C7CC;">Aa</div><div class="nm">fg-2</div><div class="hex">#C7C7CC</div></div>
    <div class="tw"><div class="sample" style="color:#8E8E93;">Aa</div><div class="nm">fg-3</div><div class="hex">#8E8E93</div></div>
    <div class="tw"><div class="sample" style="color:#5C5C63;">Aa</div><div class="nm">fg-4</div><div class="hex">#5C5C63</div></div>
  </div>
</div></body></html>
