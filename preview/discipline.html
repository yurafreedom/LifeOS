<!doctype html>
<!-- @dsCard group="Colors" name="Discipline rule" subtitle="Cool routine · warm stakes" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>brand · discipline rule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800;900&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .quote {
    font-family: 'Onest', sans-serif; font-weight: 800; font-size: 28px;
    letter-spacing: -0.025em; line-height: 1.18; color: #F5F5F7; margin-top: 8px;
  }
  .quote .cool { color: #5BB8E8; }
  .quote .warm { background: linear-gradient(135deg, #FFC066 0%, #FF8A1E 48%, #FF6B0A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-family: 'Work Sans', monospace; font-size: 11px; color: #8E8E93; margin-top: 18px; }
  .list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { font-family: 'Work Sans', monospace; font-size: 10px; padding: 4px 8px; border-radius: 6px; background: rgba(255,138,30,0.1); color: #FFC066; border: 1px solid rgba(255,138,30,0.32); }
</style></head>
<body><div class="frame">
  <div class="eyebrow">the rule</div>
  <div class="quote">
    <span class="cool">cool</span> handles the day. <span class="warm">warm</span> only when something is at stake.
  </div>
  <div class="sub">stakes are:</div>
  <div class="list">
    <span class="pill">goals</span>
    <span class="pill">money</span>
    <span class="pill">today</span>
    <span class="pill">high priority</span>
    <span class="pill">irreversible</span>
    <span class="pill">telegram-bot</span>
  </div>
</div></body></html>
