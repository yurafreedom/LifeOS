<!doctype html>
<!-- @dsCard group="Spacing" name="Motion" subtitle="Ease-out · 120/180/260ms · no bounce" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; }
  .row .nm { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; }
  .row .val { font-family: 'Work Sans', monospace; font-size: 11px; color: #C7C7CC; }
  .easing { height: 80px; padding: 14px 16px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; position: relative; overflow: hidden; }
  .easing svg { width: 100%; height: 100%; }
  .easing .nm { position: absolute; top: 10px; left: 14px; font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; }
</style></head>
<body><div class="frame">
  <div class="eyebrow">motion · ease-out, snappy</div>
  <div class="grid">
    <div class="easing">
      <div class="nm">ease-out · 0.22, 1, 0.36, 1</div>
      <svg viewBox="0 0 200 60" preserveAspectRatio="none"><path d="M0 60 C 44 60, 72 12, 200 0" stroke="#229ED9" stroke-width="2" fill="none"/></svg>
    </div>
    <div class="row"><span class="nm">fast · hover</span><span class="val">120ms</span></div>
    <div class="row"><span class="nm">default</span><span class="val">180ms</span></div>
    <div class="row"><span class="nm">slow · modal in</span><span class="val">260ms</span></div>
  </div>
  <div class="muted mono" style="margin-top:14px; font-size:10px;">fades + small translations · no bounce · no spring · no parallax</div>
</div></body></html>
