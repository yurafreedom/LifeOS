<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Direction A · wordmark with accent separator" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>brand · logo (final)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800;900&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .box {
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 22px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .nm { font-family: 'Work Sans', monospace; font-size: 9.5px; color: #8E8E93; }
  .wm-big { font-family: 'Onest', sans-serif; font-weight: 900; font-size: 48px; letter-spacing: -0.03em; color: #F5F5F7; line-height: 1; }
  .wm-med { font-family: 'Onest', sans-serif; font-weight: 900; font-size: 28px; letter-spacing: -0.03em; color: #F5F5F7; line-height: 1; }
  .wm-sm  { font-family: 'Onest', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: -0.03em; color: #F5F5F7; line-height: 1; }
  .wm-xs  { font-family: 'Onest', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: -0.025em; color: #F5F5F7; line-height: 1; }
  .dot { background: linear-gradient(135deg, #FFC066, #FF8A1E, #FF6B0A); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: flex; gap: 28px; align-items: baseline; }
  .favicon { width: 32px; height: 32px; border-radius: 7px; background: #0E1117; display:flex; align-items:center; justify-content:center; }
  .favicon-dot { width: 12px; height: 12px; border-radius: 999px; background: linear-gradient(135deg,#FFC066,#FF6B0A); }
</style></head>
<body><div class="frame">
  <div class="eyebrow">logo · direction A · final</div>
  <div class="stack">
    <div class="box">
      <div class="wm-big">Life<span class="dot">·</span>OS</div>
      <div class="nm">48px · header</div>
    </div>
    <div class="box">
      <div class="row">
        <div class="wm-med">Life<span class="dot">·</span>OS</div>
        <div class="wm-sm">Life<span class="dot">·</span>OS</div>
        <div class="wm-xs">Life<span class="dot">·</span>OS</div>
      </div>
      <div class="favicon"><div class="favicon-dot"></div></div>
    </div>
  </div>
</div></body></html>
