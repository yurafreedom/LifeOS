<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4pt scale · s-1 → s-10" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>spacing scale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
  .row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; }

  .bar { background: linear-gradient(180deg, rgba(34,158,217,0.4), rgba(34,158,217,0.15)); border-radius: 4px; width: 24px; border: 1px solid rgba(34,158,217,0.4); }

</style></head>
<body><div class="frame">
  <div class="eyebrow">spacing · 4pt scale</div>
  <div class="row">
    <div class="tok"><div class="bar" style="height:4px"></div><div class="nm">s-1</div><div class="px">4</div></div>
    <div class="tok"><div class="bar" style="height:8px"></div><div class="nm">s-2</div><div class="px">8</div></div>

    <div class="tok"><div class="bar" style="height:32px"></div><div class="nm">s-7</div><div class="px">32</div></div>

    <div class="tok"><div class="bar" style="height:56px"></div><div class="nm">s-9</div><div class="px">56</div></div>
    <div class="tok"><div class="bar" style="height:72px"></div><div class="nm">s-10</div><div class="px">72</div></div>
  </div>
  <div class="muted mono" style="margin-top:18px; font-size:10px;">16 within a card · 24 between cards · 40+ around sections</div>
</div></body></html>
